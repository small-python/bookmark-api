spring:
  application:
    # Application name — shown in logs and Swagger UI
    name: bookmark-api

  datasource:
    # JDBC connection URL pointing to our Docker PostgreSQL container
    url: jdbc:postgresql://localhost:5432/bookmark_db
    username: bookmark_user
    password: bookmark_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Validate schema against Flyway migrations — never auto-create or modify tables
      ddl-auto: validate
    properties:
      hibernate:
        # Tells Hibernate to use PostgreSQL dialect for query generation
        dialect: org.hibernate.dialect.PostgreSQLDialect
        # Logs formatted SQL to the console during development
        format_sql: true
    show-sql: true

  flyway:
    # Enables Flyway automatic migration on startup
    enabled: true
    # Flyway looks for migration scripts in this location by default
    locations: classpath:db/migration

server:
  # Port the application runs on
  port: 8080

springdoc:
  # Swagger UI available at http://localhost:8080/swagger-ui/index.html
  swagger-ui:
    path: /swagger-ui/index.html
  # OpenAPI JSON spec available at this path
  api-docs:
    path: /api-docs