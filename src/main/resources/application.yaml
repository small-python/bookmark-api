spring:
  application:
    # Application name — shown in logs and Swagger UI
    name: bookmark-api

  datasource:
    # JDBC connection URL — loaded from .env
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      # Validate schema against Flyway migrations — never auto-create or modify tables
      ddl-auto: validate
    properties:
      hibernate:
        # Logs formatted SQL to the console during development
        format_sql: true
    show-sql: true


  flyway:
    # Enables Flyway automatic migration on startup
    enabled: true
    # Flyway looks for migration scripts in this location by default
    locations: classpath:db/migration

server:
  # Port the application runs on
  port: 8080

springdoc:
  # Swagger UI available at http://localhost:8080/swagger-ui/index.html
  swagger-ui:
    path: /swagger-ui/index.html

jwt:
  # Secret key used to sign and verify JWT tokens — loaded from .env
  secret: ${JWT_SECRET}
  # Token expiration time in milliseconds — loaded from .env
  expiration: ${JWT_EXPIRATION}

logging:
  level:
    # Silences the expected warning about AuthenticationProvider and UserDetailsService coexisting
    org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer: ERROR